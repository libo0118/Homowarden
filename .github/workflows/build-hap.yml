name: build-hap

on:
  push:
    branches: [bitwarden-style]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dalongzhuazi/harmonyos-ci:api26r
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install project dependencies
        run: |
          ohpm install --all
          (cd entry && ohpm install --all)
      - name: Build unsigned HAP
        run: hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Homowarden-unsigned-hap
          path: entry/build/default/outputs/default/*-unsigned.hap
          if-no-files-found: error
