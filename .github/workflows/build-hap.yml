name: build-hap

on:
  push:
    branches: [bitwarden-style]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dalongzhuazi/harmonyos-ci:api26r
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install project dependencies
        run: |
          for dir in . entry; do
            for attempt in 1 2 3; do
              if (cd "$dir" && ohpm install --all); then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 15))
            done
          done
      - name: Build unsigned HAP
        run: hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Homowarden-unsigned-hap
          path: entry/build/default/outputs/default/*-unsigned.hap
          if-no-files-found: error
