name: build-hap

on:
  push:
    branches: [bitwarden-style]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up HarmonyOS Command Line Tools
        env:
          CLI_URL: ${{ secrets.HARMONYOS_CLI_URL }}
        run: |
          test -n "$CLI_URL" || { echo "::error::Set HARMONYOS_CLI_URL to an official HarmonyOS Command Line Tools Linux download URL"; exit 1; }
          mkdir -p "$RUNNER_TEMP/harmony-cli"
          curl --fail --location --retry 3 "$CLI_URL" -o "$RUNNER_TEMP/harmony-cli.zip"
          unzip -q "$RUNNER_TEMP/harmony-cli.zip" -d "$RUNNER_TEMP/harmony-cli"
          cli_bin="$(find "$RUNNER_TEMP/harmony-cli" -path '*/command-line-tools/bin/hvigorw' -print -quit)"
          test -n "$cli_bin"
          cli_root="$(dirname "$(dirname "$cli_bin")")"
          echo "$cli_root/bin" >> "$GITHUB_PATH"
          echo "$cli_root/tool/node/bin" >> "$GITHUB_PATH"
          echo "HOS_SDK_HOME=$cli_root/sdk" >> "$GITHUB_ENV"
      - name: Install project dependencies
        run: |
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all
          (cd entry && ohpm install --all)
      - name: Build unsigned HAP
        run: hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Homowarden-unsigned-hap
          path: entry/build/default/outputs/default/*-unsigned.hap
          if-no-files-found: error
